name: Build Native Shell APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Compile APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Udělení práv
        run: chmod +x gradlew

      - name: Sestavení Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artefaktu
        uses: actions/upload-artifact@v4
        with:
          name: Shell-App-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
